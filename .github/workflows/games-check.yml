# R69zu: فحص تلقائي مع كل رفع: يتأكد إن السيرفر يبني، وإن كل الألعاب تنلعب لين النهاية بدون أخطاء.
name: فحص الألعاب
on:
  push:
    branches: [la3bak-latest]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit || true
      - run: npx tsx --test test/games-r69.test.ts
