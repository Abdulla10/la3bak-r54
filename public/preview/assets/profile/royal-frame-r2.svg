<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="500" viewBox="0 0 600 500" fill="none">
  <title>Royal gold and amethyst avatar frame</title>
  <desc>Editable vector ornament. The circular photograph opening at 300,250 with radius 160 is completely transparent; every decorative layer is clipped outside it.</desc>
