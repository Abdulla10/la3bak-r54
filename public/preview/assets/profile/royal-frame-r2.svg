    <linearGradient id="rf-amber" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0a7"/><stop offset=".3" stop-color="#ffd468"/><stop offset=".55" stop-color="#99581b"/><stop offset=".7" stop-color="#edb74d"/><stop offset="1" stop-color="#573115"/></linearGradient>
    <linearGradient id="rf-purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efc6ff"/><stop offset=".26" stop-color="#b361f3"/><stop offset=".51" stop-color="#591790"/><stop offset=".78" stop-color="#8f32d2"/><stop offset="1" stop-color="#200d42"/></linearGradient>
    <linearGradient id="rf-ruby" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb6e3"/><stop offset=".35" stop-color="#c32381"/><stop offset=".69" stop-color="#681641"/><stop offset="1" stop-color="#2c0c32"/></linearGradient>
