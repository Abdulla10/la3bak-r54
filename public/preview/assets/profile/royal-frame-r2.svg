    <linearGradient id="rf-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2b2"/><stop offset=".25" stop-color="#e8ba57"/><stop offset=".49" stop-color="#a85f18"/><stop offset=".58" stop-color="#fff2b2"/><stop offset=".8" stop-color="#d59a34"/><stop offset="1" stop-color="#805021"/></linearGradient>
    <linearGradient id="rf-light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdeb"/><stop offset=".43" stop-color="#fff0a1"/><stop offset=".7" stop-color="#dfb04a"/><stop offset="1" stop-color="#a3671e"/></linearGradient>
