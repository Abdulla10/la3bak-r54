    <radialGradient id="face" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#fff6c4"/><stop offset=".35" stop-color="#ffd84a"/><stop offset=".75" stop-color="#f0a91a"/><stop offset="1" stop-color="#c97c0c"/></radialGradient>
