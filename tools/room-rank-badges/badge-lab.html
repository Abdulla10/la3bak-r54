<script type="module">

    for (const [x, y, s] of [[1.05, .95, .12], [-1.0, -.55, .09], [.2, 1.0, .07]]) { const sp = ext(star(s, s * .3, 4), .02, .01, new THREE.MeshBasicMaterial({ color: '#ffffff' })); sp.position.set(x, y, .6); root.add(sp); }
  }

    for (const side of [-1, 1]) for (let i = 0; i < 9; i++) { const L = 1.55 - Math.abs(i - 3) * .1; const s = new THREE.Shape(); s.moveTo(0, 0); s.quadraticCurveTo(L * .4, .2, L, 0); s.quadraticCurveTo(L * .4, -.16, 0, 0); const f = ext(s, .04, .025, M('red', { color: cols[i % cols.length], metalness: .5, roughness: .2, emissive: cols[i % cols.length], emissiveIntensity: .12 })); f.geometry.translate(L / 2, 0, 0); const a = (side > 0 ? 0 : Math.PI) + side * (.05 + i * .2); f.rotation.z = a; f.position.set(side * .25, .05, -.1 - i * .01); root.add(f); }
    for (let i = -2; i <= 2; i++) { const L = 1.0 - Math.abs(i) * .12; const s = new THREE.Shape(); s.moveTo(0, 0); s.quadraticCurveTo(L * .4, .14, L, 0); s.quadraticCurveTo(L * .4, -.12, 0, 0); const f = ext(s, .04, .02, M('red', { color: cols[(i + 2) % cols.length], metalness: .5, roughness: .2 })); f.geometry.translate(L / 2, 0, 0); f.rotation.z = -Math.PI / 2 + i * .22; f.position.set(0, -.35, -.15); root.add(f); }

    const la = laurel(1.05, M('gold'), -1.45, -.35, 6); la.position.set(0, .05, .15); root.add(la);

  root.rotation.y = -.22; root.rotation.x = .08;
